name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt pytest

      - name: Tests (souveraineté + geoip)
        run: |
          pytest tests/ -v

      - name: Syntaxe des agents
        run: |
          bash -n agent/sentinelle-agent.sh
          bash -n install.sh
          python -m py_compile agent/cve-collect.py agent/sovereignty-collect.py agent/geoip-download.py api/app/*.py
